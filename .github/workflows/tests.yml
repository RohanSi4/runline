name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # requirements.txt pins the versions the shipped pickled graphs load
      # under; the build extra brings osmium so the PBF builder tests run
      # instead of skipping.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -e '.[dev,build]'

      - name: Python tests
        run: python -m pytest -q -rs

      - name: Browser logic tests
        run: node --test tests/web_flow.mjs tests/run_session.mjs
