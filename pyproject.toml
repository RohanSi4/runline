[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "runline"
version = "0.1.0"
description = "Constraint-based running loop generation and scoring"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "networkx>=3.4,<4",
  "osmnx>=2.0,<3",
  "requests>=2.32,<3",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[project.scripts]
runline = "runline.cli:main"
runline-web = "runline.api:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.vercel]
entrypoint = "src.runline.api:app"
