<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 290" role="img" aria-labelledby="title">
  <title id="title">Precompute pipeline: the 11 GB US OpenStreetMap extract and the top 50 metros, cut into 8,675 tiles, become tile walk graphs with elevation; every 200 meter cell is pooled for three surfaces at 1 to 12 miles, ten loops per target, into pools.sqlite</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#62655d"/>
    </marker>
    <style>
      text { font-family: "DM Sans", "Inter", -apple-system, "Segoe UI", sans-serif; fill: #20221f; }
      .name { font-size: 16px; font-weight: 600; }
      .sub { font-size: 12.5px; fill: #62655d; }
      .node { fill: #fbfaf6; stroke: #deddd6; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="1140" height="290" rx="22" fill="#f4f1e9"/>

  <!-- top row: data flow -->
  <rect class="node" x="20" y="24" width="190" height="96" rx="12"/>
  <text class="name" x="38" y="66">US OSM extract</text>
  <text class="sub" x="38" y="90">Geofabrik · 11 GB</text>

  <rect class="node" x="250" y="24" width="190" height="96" rx="12"/>
  <text class="name" x="268" y="66">Tile extracts</text>
  <text class="sub" x="268" y="90">osmium · 14 per job</text>

  <rect class="node" x="480" y="24" width="190" height="96" rx="12"/>
  <text class="name" x="498" y="66">Tile graphs</text>
  <text class="sub" x="498" y="90">walk graph + elevation</text>

  <rect class="node" x="710" y="24" width="190" height="96" rx="12" fill="#f1f6dc" stroke="#c8e663"/>
  <text class="name" x="728" y="66">Every 200 m cell</text>
  <text class="sub" x="728" y="90">3 surfaces × 1–12 mi</text>

  <rect x="940" y="24" width="180" height="96" rx="12" fill="#193c2c"/>
  <text class="name" x="958" y="66" style="fill:#fbfaf6">pools.sqlite</text>
  <text class="sub" x="958" y="90" style="fill:#dfe9c4">a row per cell + surface</text>

  <!-- bottom row: where the tiles come from -->
  <rect class="node" x="20" y="170" width="190" height="96" rx="12"/>
  <text class="name" x="38" y="212">Top 50 metros</text>
  <text class="sub" x="38" y="236">Census urban areas</text>

  <rect class="node" x="250" y="170" width="190" height="96" rx="12"/>
  <text class="name" x="268" y="212">8,675 tiles</text>
  <text class="sub" x="268" y="236">13.8 km, each owns 3 km</text>

  <!-- tile discs: overlapping graphs, owned centres -->
  <g transform="translate(560 218)">
    <g fill="none" stroke="#c8e663" stroke-width="1.5">
      <circle cx="0" cy="0" r="40"/>
      <circle cx="52" cy="0" r="40"/>
      <circle cx="26" cy="-30" r="40" opacity="0.55"/>
    </g>
    <g fill="#2f6348">
      <circle cx="0" cy="0" r="9"/>
      <circle cx="52" cy="0" r="9"/>
      <circle cx="26" cy="-30" r="9" opacity="0.55"/>
    </g>
  </g>
  <text class="sub" x="684" y="214">big discs overlap so every cell's</text>
  <text class="sub" x="684" y="232">12 mile loop fits; each cell has one owner</text>

  <!-- edges -->
  <g fill="none" stroke="#62655d" stroke-width="1.6">
    <path d="M210 72 H246" marker-end="url(#arrow)"/>
    <path d="M440 72 H476" marker-end="url(#arrow)"/>
    <path d="M670 72 H706" marker-end="url(#arrow)"/>
    <path d="M900 72 H936" marker-end="url(#arrow)"/>
    <path d="M210 218 H246" marker-end="url(#arrow)"/>
    <path d="M345 170 V124" marker-end="url(#arrow)"/>
  </g>
</svg>
