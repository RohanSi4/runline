<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 250" role="img" aria-labelledby="title">
  <title id="title">Precomputing routes in four steps. Ahead of time on the cluster, generate candidate loops for every starting area and save them. When a request arrives, filter the saved loops to the requested distance and rank them by the runner's preferences</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#62655d"/>
    </marker>
    <style>
      text { font-family: "DM Sans", "Inter", -apple-system, "Segoe UI", sans-serif; fill: #20221f; }
      .name { font-size: 19px; font-weight: 600; }
      .what { font-size: 13.5px; }
      .tech { font-size: 12px; fill: #62655d; }
      .tag { font-size: 13px; font-weight: 600; fill: #2f6348; }
    </style>
  </defs>
  <rect width="1140" height="250" rx="22" fill="#f4f1e9"/>

  <text class="tag" x="28" y="40">Ahead of time, on the cluster</text>
  <text class="tag" x="604" y="40">When a request arrives</text>

  <g fill="#fbfaf6" stroke="#deddd6" stroke-width="1.5">
    <rect x="28" y="58" width="236" height="160" rx="14"/>
    <rect x="316" y="58" width="236" height="160" rx="14"/>
    <rect x="604" y="58" width="236" height="160" rx="14"/>
    <rect x="892" y="58" width="220" height="160" rx="14"/>
  </g>

  <text class="name" x="50" y="96">Generate</text>
  <text class="what" x="50" y="124">Candidate loops at 1–12</text>
  <text class="what" x="50" y="143">miles from every starting</text>
  <text class="what" x="50" y="162">area, for each surface</text>
  <text class="tech" x="50" y="198">10 per target, duplicates removed</text>

  <text class="name" x="338" y="96">Save</text>
  <text class="what" x="338" y="124">One compact record per</text>
  <text class="what" x="338" y="143">starting area and surface</text>
  <text class="tech" x="338" y="198">route pool · pools.sqlite</text>

  <text class="name" x="626" y="96">Filter</text>
  <text class="what" x="626" y="124">Keep loops near the</text>
  <text class="what" x="626" y="143">requested distance</text>
  <text class="tech" x="626" y="198">within ±0.25 mi</text>

  <text class="name" x="914" y="96">Rank</text>
  <text class="what" x="914" y="124">Order by the runner's</text>
  <text class="what" x="914" y="143">preferences, show 3</text>
  <text class="tech" x="914" y="198">same scoring as live routes</text>

  <g fill="none" stroke="#62655d" stroke-width="1.6">
    <path d="M264 138 H312" marker-end="url(#arrow)"/>
    <path d="M552 138 H600" marker-end="url(#arrow)"/>
    <path d="M840 138 H888" marker-end="url(#arrow)"/>
  </g>
</svg>
