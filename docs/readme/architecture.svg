<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 330" role="img" aria-labelledby="title">
  <title id="title">Architecture: the Leaflet frontend sends a start and preferences to the FastAPI backend on Vercel; its planner searches the walk graph shipped with the deploy and returns three loops and a GPX file; route pools precomputed on the UVA CS cluster are the next data source</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#62655d"/>
    </marker>
    <style>
      text { font-family: "DM Sans", "Inter", -apple-system, "Segoe UI", sans-serif; fill: #20221f; }
      .group { font-size: 13.5px; font-weight: 600; fill: #2f6348; }
      .name { font-size: 16px; font-weight: 600; }
      .sub { font-size: 12.5px; fill: #62655d; }
      .edge { font-size: 12px; fill: #62655d; }
      .node { fill: #fbfaf6; stroke: #deddd6; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="1140" height="330" rx="22" fill="#f4f1e9"/>

  <!-- groups -->
  <g fill="none" stroke="#deddd6" stroke-width="1.5">
    <rect x="16" y="16" width="214" height="264" rx="16"/>
    <rect x="334" y="16" width="300" height="264" rx="16" fill="#f1f6dc" stroke="#c8e663"/>
    <rect x="674" y="16" width="220" height="264" rx="16"/>
    <rect x="934" y="16" width="190" height="264" rx="16" stroke-dasharray="5 5"/>
  </g>
  <text class="group" x="36" y="44">Frontend · web/</text>
  <text class="group" x="354" y="44">Backend · FastAPI on Vercel</text>
  <text class="group" x="694" y="44">Shipped with the deploy</text>
  <text class="group" x="954" y="44">UVA CS cluster</text>

  <!-- nodes -->
  <rect class="node" x="34" y="104" width="178" height="92" rx="12"/>
  <text class="name" x="52" y="138">Leaflet map</text>
  <text class="sub" x="52" y="160">start, distance,</text>
  <text class="sub" x="52" y="178">surface, hills</text>

  <rect class="node" x="354" y="68" width="260" height="78" rx="12"/>
  <text class="name" x="372" y="100">API</text>
  <text class="sub" x="372" y="124">/api/routes · places · areas</text>

  <rect class="node" x="354" y="184" width="260" height="78" rx="12"/>
  <text class="name" x="372" y="216">Planner</text>
  <text class="sub" x="372" y="240">osm.py · scoring.py</text>

  <rect class="node" x="694" y="68" width="180" height="78" rx="12"/>
  <text class="name" x="712" y="100">Places</text>
  <text class="sub" x="712" y="124">autocomplete list</text>

  <rect class="node" x="694" y="184" width="180" height="78" rx="12"/>
  <text class="name" x="712" y="216">Walk graph</text>
  <text class="sub" x="712" y="240">graphs/*.pkl.gz</text>

  <rect x="954" y="184" width="150" height="78" rx="12" fill="#193c2c"/>
  <text class="name" x="972" y="216" style="fill:#fbfaf6">Route pools</text>
  <text class="sub" x="972" y="240" style="fill:#c8e663">pools.sqlite</text>

  <!-- edges -->
  <g fill="none" stroke="#62655d" stroke-width="1.6">
    <path d="M212 114 H350" marker-end="url(#arrow)"/>
    <path d="M354 138 H216" marker-end="url(#arrow)"/>
    <path d="M484 146 V180" marker-end="url(#arrow)"/>
    <path d="M614 107 H690" marker-end="url(#arrow)"/>
    <path d="M614 223 H690" marker-end="url(#arrow)"/>
    <path d="M484 262 V300 H1029 V266" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
  </g>
  <text class="edge" x="283" y="104" text-anchor="middle">start, preferences</text>
  <text class="edge" x="283" y="157" text-anchor="middle">3 loops + GPX</text>
  <text class="edge" x="760" y="320" text-anchor="middle">next: look up a pool instead of generating</text>
</svg>
