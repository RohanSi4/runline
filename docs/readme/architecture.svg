<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 300" role="img" aria-labelledby="title">
  <title id="title">How RunLine works today: the browser sends a start and preferences to the route planner, which searches map data saved with the app and sends back up to three routes and a GPX file. Planned: routes saved ahead of time on the cluster, so the planner can look a route up instead of searching</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#62655d"/>
    </marker>
    <style>
      text { font-family: "DM Sans", "Inter", -apple-system, "Segoe UI", sans-serif; fill: #20221f; }
      .name { font-size: 18px; font-weight: 600; }
      .what { font-size: 13.5px; }
      .tech { font-size: 12px; fill: #62655d; }
      .edge { font-size: 12.5px; fill: #62655d; }
      .tag { font-size: 13px; font-weight: 600; fill: #2f6348; }
    </style>
  </defs>
  <rect width="1140" height="300" rx="22" fill="#f4f1e9"/>

  <!-- today -->
  <text class="tag" x="28" y="38">Today</text>
  <g fill="#fbfaf6" stroke="#deddd6" stroke-width="1.5">
    <rect x="28" y="56" width="280" height="116" rx="14"/>
    <rect x="430" y="56" width="280" height="116" rx="14"/>
    <rect x="832" y="56" width="280" height="116" rx="14"/>
  </g>
  <text class="name" x="50" y="90">Browser</text>
  <text class="what" x="50" y="116">Map, start, distance,</text>
  <text class="what" x="50" y="135">surface and hills</text>
  <text class="tech" x="50" y="158">web/ · Leaflet</text>

  <text class="name" x="452" y="90">Route planner</text>
  <text class="what" x="452" y="116">Finds and ranks loops</text>
  <text class="what" x="452" y="135">on the street network</text>
  <text class="tech" x="452" y="158">src/runline/ · FastAPI on Vercel</text>

  <text class="name" x="854" y="90">Saved map data</text>
  <text class="what" x="854" y="116">Charlottesville streets,</text>
  <text class="what" x="854" y="135">paths and elevation</text>
  <text class="tech" x="854" y="158">graphs/ · from OpenStreetMap</text>

  <g fill="none" stroke="#62655d" stroke-width="1.6">
    <path d="M308 98 H426" marker-end="url(#arrow)"/>
    <path d="M430 134 H312" marker-end="url(#arrow)"/>
    <path d="M710 114 H828" marker-end="url(#arrow)"/>
  </g>
  <text class="edge" x="369" y="88" text-anchor="middle">your request</text>
  <text class="edge" x="369" y="156" text-anchor="middle">routes + GPX</text>
  <text class="edge" x="769" y="104" text-anchor="middle">searches</text>

  <!-- planned -->
  <text class="tag" x="28" y="226" style="fill:#62655d">Planned</text>
  <rect x="430" y="198" width="682" height="78" rx="14" fill="none" stroke="#8a8d84" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text class="name" x="452" y="230" style="font-size:16px">Saved routes</text>
  <text class="what" x="452" y="255">Loops computed ahead of time on the UVA CS cluster, looked up instead of searched.</text>
  <path d="M570 172 V194" fill="none" stroke="#8a8d84" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
</svg>
