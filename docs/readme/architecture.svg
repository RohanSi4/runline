<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 432" role="img" aria-labelledby="title"><title id="title">The browser loads runline-nine.vercel.app, whose /api rewrite reaches FastAPI on runline-capstone.vercel.app with the rebuilt Charlottesville graph and complete pool. On a coverage miss it forwards the request through RUNLINE_REMOTE_API to the Oracle VM, which serves Washington, DC from its tile graphs and pools.</title><clipPath id="card"><rect width="1140" height="432" rx="22"/></clipPath><g clip-path="url(#card)"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#62655d"/></marker><style>text { font-family: "DM Sans", "Inter", -apple-system, "Segoe UI", sans-serif; fill: #20221f; }.name { font-size: 17px; font-weight: 600; } .what { font-size: 13.5px; }.tech { font-size: 12px; fill: #62655d; } .edge { font-size: 12.5px; fill: #62655d; }.tag { font-size: 13px; font-weight: 600; fill: #2f6348; }</style></defs><rect width="1140" height="432" fill="#f4f1e9"/><text class="tag" x="28" y="38">Every request</text><rect x="28" y="56" width="300" height="148" rx="14" stroke-width="1.5" stroke="#deddd6" fill="#fbfaf6"/><text class="name" x="50" y="88">Browser</text><text class="what" x="50" y="114">Map, start, distance,</text><text class="what" x="50" y="133">surface and hills;</text><text class="what" x="50" y="152">GPX download</text><text class="tech" x="50" y="188">web/ · Leaflet</text><rect x="420" y="56" width="300" height="148" rx="14" stroke-width="1.5" stroke="#deddd6" fill="#fbfaf6"/><text class="name" x="442" y="88">runline-nine.vercel.app</text><text class="what" x="442" y="114">Canonical site: serves the page</text><text class="what" x="442" y="133">Rewrites /api/* to the</text><text class="what" x="442" y="152">capstone API (same origin)</text><text class="tech" x="442" y="188">vercel.json · Git deployment</text><rect x="812" y="56" width="300" height="148" rx="14" stroke-width="1.5" stroke="#deddd6" fill="#fbfaf6"/><text class="name" x="834" y="88">runline-capstone.vercel.app</text><text class="what" x="834" y="114">FastAPI with the rebuilt</text><text class="what" x="834" y="133">Charlottesville graph + full pool</text><text class="what" x="834" y="152">Saved loops first, live on a miss</text><text class="tech" x="834" y="188">scripts/release_capstone.py</text><path d="M328 104 H416" fill="none" stroke="#62655d" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M420 160 H332" fill="none" stroke="#62655d" stroke-width="1.6" marker-end="url(#arrow)"/><text class="edge" x="374" y="94" text-anchor="middle">page + /api</text><text class="edge" x="374" y="182" text-anchor="middle">routes + GPX</text><path d="M720 104 H808" fill="none" stroke="#62655d" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M812 160 H724" fill="none" stroke="#62655d" stroke-width="1.6" marker-end="url(#arrow)"/><text class="edge" x="766" y="94" text-anchor="middle">/api/* rewrite</text><text class="edge" x="766" y="182" text-anchor="middle">routes + GPX</text><rect x="812" y="268" width="300" height="140" rx="14" stroke-width="1.5" stroke="#deddd6" fill="#fbfaf6"/><text class="name" x="834" y="300">Oracle VM regional API</text><text class="what" x="834" y="326">FastAPI on main: Washington, DC</text><text class="what" x="834" y="345">230 tile graphs + 2.3 GB pools</text><text class="tech" x="834" y="392">Direct HTTPS URL · no forwarding</text><path d="M892 204 V264" fill="none" stroke="#62655d" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M982 268 V208" fill="none" stroke="#62655d" stroke-width="1.6" marker-end="url(#arrow)"/><text class="edge" x="882" y="232" text-anchor="end">Coverage miss only:</text><text class="edge" x="882" y="250" text-anchor="end">RUNLINE_REMOTE_API</text><text class="edge" x="992" y="241" text-anchor="start">routes + GPX</text><text class="tag" x="28" y="272" style="fill:#62655d">Built ahead of time</text><rect x="28" y="288" width="692" height="120" rx="14" stroke-width="1.5" stroke="#8a8d84" stroke-dasharray="6 5" fill="none"/><text class="name" x="50" y="320">Saved routes</text><text class="what" x="50" y="346">Loops computed on the UVA CS cluster. Each pool ships beside its exact graph;</text><text class="what" x="50" y="365">a pool built for another graph is ignored and that start plans live.</text><text class="tech" x="50" y="392">Cville data pinned in deploy/capstone-artifacts.json</text></g></svg>
