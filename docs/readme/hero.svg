<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="title">
  <title id="title">A running loop drawn on a street grid: the selected loop in orange leaves the start pin and comes back to it, with two alternative loops in blue and purple</title>
  <defs>
    <clipPath id="frame"><rect width="1200" height="400" rx="22"/></clipPath>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#28241e" flood-opacity="0.18"/>
    </filter>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="400" fill="#f4f1e9"/>
    <g transform="translate(0 -45) rotate(-9 600 200)">
      <!-- park inside the selected loop -->
      <path d="M738 162 H882 V332 H738 Z" fill="#f1f6dc"/>
      <path d="M288 88 H432 V192 H288 Z" fill="#f1f6dc" opacity="0.7"/>
      <!-- streets -->
      <g stroke="#deddd6" stroke-width="3" stroke-linecap="round">
        <path d="M-120 0 H1320 M-120 70 H1320 M-120 140 H1320 M-120 210 H1320 M-120 280 H1320 M-120 350 H1320 M-120 420 H1320 M-120 490 H1320"/>
        <path d="M0 -160 V560 M90 -160 V560 M180 -160 V560 M270 -160 V560 M360 -160 V560 M450 -160 V560 M540 -160 V560 M630 -160 V560 M720 -160 V560 M810 -160 V560 M900 -160 V560 M990 -160 V560 M1080 -160 V560 M1170 -160 V560 M1260 -160 V560"/>
      </g>
      <!-- a major road the loops avoid -->
      <path d="M1080 -160 V560" stroke="#e2e0d7" stroke-width="12"/>
      <path d="M-120 490 H1320" stroke="#e2e0d7" stroke-width="12"/>
      <!-- alternatives, faint like unselected options in the app -->
      <g fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-width="5" opacity="0.55">
        <path d="M630 210 H450 V70 H270 V280 H630 Z" stroke="#235f9f"/>
        <path d="M630 210 V420 H900 V350 H810 V280 H720 V210 Z" stroke="#7a4d96"/>
      </g>
      <!-- selected loop: white casing, then the route colour -->
      <g fill="none" stroke-linejoin="round" stroke-linecap="round">
        <path d="M630 210 V140 H990 V350 H720 V280 H630 Z" stroke="#fbfaf6" stroke-width="15"/>
        <path d="M630 210 V140 H990 V350 H720 V280 H630 Z" stroke="#e2552f" stroke-width="8"/>
      </g>
      <!-- direction ticks along the selected loop -->
      <g fill="#fbfaf6">
        <path d="M806 133 l10 7 -10 7 z"/>
        <path d="M983 246 l7 10 7 -10 z"/>
        <path d="M854 343 l-10 7 10 7 z"/>
      </g>
    </g>
    <!-- start pin, kept upright: the loop start (630, 210) after the grid rotation -->
    <g transform="translate(631.2 160.2)" filter="url(#lift)">
      <circle r="19" fill="#193c2c"/>
      <circle r="13" fill="none" stroke="#c8e663" stroke-width="2.5"/>
      <circle r="5.5" fill="#c8e663"/>
    </g>
  </g>
</svg>
